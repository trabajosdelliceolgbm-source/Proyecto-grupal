<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>



<style>

body{
  margin:0;
  background:#111;
  font-family:Arial, sans-serif;
}

h1{
  color:white;
  text-align:center;
  padding:30px;
}

/* GALERIA */
.galeria{
  width:90%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding-bottom:40px;
}

/* IMAGENES */
.galeria img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
  transition:0.4s;
}

.galeria img:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(255,255,255,0.3);
}

/* VENTANA EMERGENTE */
.modal{
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);

  justify-content:center;
  align-items:center;
}

/* IMAGEN GRANDE */
.modal img{
  max-width:90%;
  max-height:80%;
  border-radius:15px;
  animation:zoom 0.3s;
}

/* BOTON CERRAR */
.cerrar{
  position:absolute;
  top:20px;
  right:40px;
  color:white;
  font-size:40px;
  cursor:pointer;
}

/* ANIMACION */
@keyframes zoom{
  from{
    transform:scale(0.5);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

</style>
</head>

<body>

<h1>Galería Interactiva</h1>

<div class="galeria">

  <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop" onclick="abrir(this.src)">

  <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200&auto=format&fit=crop" onclick="abrir(this.src)">

  <img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308?q=80&w=1200&auto=format&fit=crop" onclick="abrir(this.src)">

  <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop" onclick="abrir(this.src)">

</div>

<!-- MODAL -->
<div class="modal" id="modal">

  <span class="cerrar" onclick="cerrar()">&times;</span>

  <img id="imagen-grande">

</div>

<script>

const modal = document.getElementById("modal");
const imagenGrande = document.getElementById("imagen-grande");

/* ABRIR IMAGEN */
function abrir(src){
  modal.style.display = "flex";
  imagenGrande.src = src;
}

/* CERRAR IMAGEN */
function cerrar(){
  modal.style.display = "none";
}

/* CERRAR AL HACER CLICK FUERA */
modal.addEventListener("click", function(e){

  if(e.target !== imagenGrande){
    cerrar();
  }

});

</script>

</body>
</html>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  height:100vh;
}

/* BOTÓN */
.menu-btn{
  position:fixed;
  top:20px;
  right:20px;
  width:45px;
  cursor:pointer;
  z-index:1001;
}

.menu-btn span{
  display:block;
  height:5px;
  margin:6px 0;
  background:white;
  border-radius:5px;
  transition:0.4s;
}

/* ANIMACIÓN X */
.menu-btn.active span:nth-child(1){
  transform:translateY(11px) rotate(45deg);
}

.menu-btn.active span:nth-child(2){
  opacity:0;
}

.menu-btn.active span:nth-child(3){
  transform:translateY(-11px) rotate(-45deg);
}

/* MENU */
.menu{
  position:fixed;
  top:0;
  right:-260px;
  width:260px;
  height:100%;
  background:#222;
  padding-top:80px;
  transition:0.4s;
  z-index:1000;
}

.menu.active{
  right:0;
}

/* LINKS */
.menu a{
  display:block;
  color:white;
  text-decoration:none;
  padding:18px 25px;
  font-size:18px;
  transition:0.3s;
}

.menu a:hover{
  background:#444;
  padding-left:35px;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:999;
}

.overlay.active{
  display:block;
}

h1{
  color:white;
  text-align:center;
  padding-top:100px;
}

</style>
</head>

<body>

<!-- BOTÓN -->
<div class="menu-btn" id="menu-btn">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- MENÚ -->
<div class="menu" id="menu">
  <a href="index.html">Inicio</a>
  <a href="Galeria.html">Galería</a>
  <a href="servicios.html">Servicios</a>
  <a href="contacto.html">Contacto</a>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<h1>Mi Página Web</h1>

<script>

const menuBtn = document.getElementById("menu-btn");
const menu = document.getElementById("menu");
const overlay = document.getElementById("overlay");
const links = document.querySelectorAll(".menu a");

function toggleMenu(){
  menuBtn.classList.toggle("active");
  menu.classList.toggle("active");
  overlay.classList.toggle("active");
}

/* BOTÓN */
menuBtn.addEventListener("click", toggleMenu);

/* OVERLAY */
overlay.addEventListener("click", toggleMenu);

/* LINKS */
links.forEach(link => {
  link.addEventListener("click", toggleMenu);
});

</script>

</body>
</html>
